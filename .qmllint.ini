# qmllint configuration for todochy.
#
# Off an Omarchy machine the shell's own modules (qs.Ui, qs.Commons,
# Quickshell) cannot be resolved, and a minimal CI image does not even ship
# QtQuick's type information. Every warning below is a direct consequence of
# those missing imports: the import failure itself, the unresolvable types and
# properties it cascades into, the unqualified lookups and the phantom
# inheritance cycle on the unresolved roots, and the signal-handler check that
# cannot see the unresolved Process type. They are kept at info so they print
# but never gate: on Qt < 6.8 any warning exits 255 and would fail CI on noise
# alone. A real syntax error still fails on every Qt version.
#
# qmllint renamed several warning keys over the years, and unknown keys are
# silently ignored, so both the old and the new spelling of each silenced
# category are listed to cover the apt Qt (6.4) used in CI and newer local
# toolchains alike.

[Warnings]
ImportFailure=info
InheritanceCycle=info
UnqualifiedAccess=info
# Unknown properties: old spelling first, then the current one.
UnknownProperty=info
MissingProperty=info
# Unresolvable types: old spelling first, then the current one.
TypeError=info
UnresolvedType=info
# Bad signal-handler parameters: old spelling first, then the current one.
BadSignalHandler=info
BadSignalHandlerParameters=info
